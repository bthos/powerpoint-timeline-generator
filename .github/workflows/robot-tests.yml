name: Robot Framework Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create directories
      run: |
        mkdir -p reports

    - name: Run Robot Framework tests
      env:
        EXCEL_FILE_PATH: timeline.xlsx
        EXCEL_SHEET_NAME: TimelineData
        LOG_LEVEL: INFO
      run: |
        cd tests && robot --outputdir ../reports --loglevel INFO test_timeline_data.robot

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-reports-${{ matrix.os }}-${{ matrix.python-version }}
        path: reports/
        retention-days: 7

    - name: Publish test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: reports/output.xml

